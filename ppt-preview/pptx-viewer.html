<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta charset="UTF-8">
    <title>PPTX Mobile Viewer</title>
    <script src="https://unpkg.com/pptx-preview@latest/dist/pptx-preview.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            background: white;
            position: relative;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
            z-index: 100;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007AFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ff3b30;
            padding: 20px;
            max-width: 90%;
            z-index: 100;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border-radius: 25px;
            padding: 10px 20px;
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .controls button {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .controls button:active {
            background: rgba(255, 255, 255, 0.3);
        }

        .controls button:disabled {
            opacity: 0.4;
        }

        .slide-info {
            color: white;
            font-size: 14px;
            font-weight: 500;
            min-width: 50px;
            text-align: center;
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            .controls {
                bottom: 10px;
                padding: 8px 16px;
            }
            
            .controls button {
                font-size: 18px;
                padding: 10px 14px;
            }
        }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body>
    <div id="container">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>正在加载 PPTX 文件...</div>
        </div>
    </div>

    <div class="controls" id="controls">
        <button id="prevBtn" ontouchstart="" onclick="prevSlide()">‹</button>
        <span class="slide-info" id="slideInfo">1 / 1</span>
        <button id="nextBtn" ontouchstart="" onclick="nextSlide()">›</button>
    </div>

    <script>
        // 全局变量
        let pptxViewer = null;
        let currentSlide = 1;
        let totalSlides = 1;
        let isErrorMode = false;

        // 获取文件路径参数
        const params = new URLSearchParams(window.location.search);
        const fileUrl = params.get("file");

        // 启动应用
        if (!fileUrl) {
            showError('缺少 file 参数<br>用法: ?file=文件路径');
        } else {
            // 等待 pptx-preview 库加载完成
            if (typeof window.pptxPreview !== 'undefined') {
                loadPPTX();
            } else {
                // 等待库加载
                window.addEventListener('load', loadPPTX);
            }
        }

        // 主要加载函数
        async function loadPPTX() {
            try {
                console.log('开始加载 PPTX 文件:', fileUrl);

                // 加载文件数据
                const arrayBuffer = await loadFileAsArrayBuffer(fileUrl);
                console.log('文件加载成功，大小:', (arrayBuffer.byteLength / 1024 / 1024).toFixed(2), 'MB');

                // 隐藏加载提示
                hideLoading();

                // 初始化预览器
                await initViewer(arrayBuffer);

            } catch (error) {
                console.error('加载失败:', error);
                hideLoading();
                showError('加载失败<br>' + error.message);
            }
        }

        // 加载文件为 ArrayBuffer
        function loadFileAsArrayBuffer(url) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                
                xhr.onload = function() {
                    // file:// 协议返回 status 0，http/https 返回 200
                    if (xhr.status === 0 || xhr.status === 200) {
                        resolve(xhr.response);
                    } else {
                        reject(new Error(`HTTP ${xhr.status}: 文件不存在或无权限访问`));
                    }
                };
                
                xhr.onerror = function() {
                    reject(new Error('网络错误或文件路径无效'));
                };
                
                xhr.ontimeout = function() {
                    reject(new Error('加载超时'));
                };
                
                xhr.open('GET', url);
                xhr.responseType = 'arraybuffer';
                xhr.timeout = 30000; // 30秒超时
                xhr.send();
            });
        }

        // 初始化预览器
        async function initViewer(arrayBuffer) {
            const container = document.getElementById('container');
            
            try {
                // 检查 pptx-preview 是否可用
                if (typeof window.pptxPreview === 'undefined') {
                    throw new Error('pptx-preview 库未加载');
                }

                // 获取容器尺寸
                const rect = container.getBoundingClientRect();
                console.log('容器尺寸:', rect.width, 'x', rect.height);

                // 初始化预览器
                pptxViewer = window.pptxPreview.init(container, {
                    width: rect.width,
                    height: rect.height
                });

                console.log('预览器初始化成功');

                // 尝试预览文件
                const result = await safePreview(arrayBuffer);
                
                if (!isErrorMode) {
                    // 成功预览，设置导航
                    totalSlides = result?.totalSlides || result?.slides?.length || 1;
                    currentSlide = 1;
                    
                    if (totalSlides > 1) {
                        showControls();
                    }
                    
                    console.log('预览成功，幻灯片数:', totalSlides);
                }

            } catch (error) {
                console.error('初始化失败:', error);
                showFallback(arrayBuffer);
            }
        }

        // 安全预览（带错误处理）
        async function safePreview(arrayBuffer) {
            try {
                return await pptxViewer.preview(arrayBuffer);
            } catch (error) {
                console.warn('预览失败，显示降级界面:', error.message);
                showFallback(arrayBuffer);
                isErrorMode = true;
                return { totalSlides: 1, error: true };
            }
        }

        // 显示降级界面
        function showFallback(arrayBuffer) {
            const container = document.getElementById('container');
            const sizeInMB = (arrayBuffer.byteLength / 1024 / 1024).toFixed(2);
            
            container.innerHTML = `
                <div style="
                    display: flex; 
                    flex-direction: column; 
                    align-items: center; 
                    justify-content: center; 
                    height: 100%; 
                    padding: 20px; 
                    text-align: center; 
                    color: #666;
                    line-height: 1.5;
                ">
                    <div style="font-size: 64px; margin-bottom: 25px;">📄</div>
                    <h2 style="margin-bottom: 15px; color: #333; font-size: 24px;">PPTX 文件已加载</h2>
                    <p style="margin-bottom: 8px; font-size: 16px;">文件大小: ${sizeInMB} MB</p>
                    <div style="
                        margin-top: 25px; 
                        padding: 20px; 
                        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
                        color: white;
                        border-radius: 12px; 
                        max-width: 350px;
                        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
                    ">
                        <p style="margin: 0; font-size: 14px;">
                            ✨ 该文件包含复杂的演示元素<br>
                            💡 建议使用 Microsoft PowerPoint<br>
                            📱 或其他专业软件查看完整内容
                        </p>
                    </div>
                </div>
            `;
            
            isErrorMode = true;
        }

        // 显示/隐藏函数
        function hideLoading() {
            const loading = document.getElementById('loading');
            if (loading) loading.style.display = 'none';
        }

        function showError(message) {
            const container = document.getElementById('container');
            container.innerHTML = `
                <div class="error">
                    <div style="font-size: 48px; margin-bottom: 15px;">❌</div>
                    <h3 style="margin-bottom: 15px;">加载失败</h3>
                    <p style="font-size: 14px; line-height: 1.4;">${message}</p>
                </div>
            `;
        }

        function showControls() {
            document.getElementById('controls').style.display = 'flex';
            updateSlideInfo();
        }

        function updateSlideInfo() {
            document.getElementById('slideInfo').textContent = `${currentSlide} / ${totalSlides}`;
            document.getElementById('prevBtn').disabled = currentSlide <= 1;
            document.getElementById('nextBtn').disabled = currentSlide >= totalSlides;
        }

        // 导航函数
        function prevSlide() {
            if (!isErrorMode && pptxViewer && typeof pptxViewer.goToSlide === 'function' && currentSlide > 1) {
                try {
                    currentSlide--;
                    pptxViewer.goToSlide(currentSlide - 1);
                    updateSlideInfo();
                } catch (e) {
                    console.warn('切换幻灯片失败:', e);
                }
            }
        }

        function nextSlide() {
            if (!isErrorMode && pptxViewer && typeof pptxViewer.goToSlide === 'function' && currentSlide < totalSlides) {
                try {
                    currentSlide++;
                    pptxViewer.goToSlide(currentSlide - 1);
                    updateSlideInfo();
                } catch (e) {
                    console.warn('切换幻灯片失败:', e);
                }
            }
        }

        // 窗口大小调整
        window.addEventListener('resize', function() {
            if (!isErrorMode && pptxViewer && typeof pptxViewer.resize === 'function') {
                const container = document.getElementById('container');
                const rect = container.getBoundingClientRect();
                try {
                    pptxViewer.resize(rect.width, rect.height);
                } catch (e) {
                    console.warn('调整大小失败:', e);
                }
            }
        });

        // 防止页面滚动和缩放
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });
    </script>
</body>

</html>
